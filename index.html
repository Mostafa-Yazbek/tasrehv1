<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064239" />
    <meta name="description" content="واجهة مصرّح لإدارة وتصنيف طلبات التصاريح." />
    <link rel="icon" type="image/png" href="assets/images/damascus-eagle.png" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>مصرّح | إدارة التصاريح</title>
  </head>
  <body class="auth-shell">
    <!-- Musarrah reference style: original patterned pine background, wheat content card, Damascus eagle. -->
    <main class="home-card" aria-labelledby="home-title">
      <header class="home-heading">
        <img src="assets/images/لوغو 1.png" class="home-logo" alt="شعار محافظة دمشق" />
        <h1 id="home-title">مصرّح</h1>
        <p>اختر نوع التصريح لبدء الإجراء.</p>
      </header>

      <nav class="permit-choice-grid" aria-label="أنواع التصاريح">
        <a class="permit-choice" href="pages/transport.html">
          <img class="choice-art" src="assets/images/truck-pineal-700.svg" alt="" aria-hidden="true" />
          <span class="choice-number"></span>
          <span class="choice-content">
            <strong class="choice-title">تصريح نقل</strong>
            <span class="choice-description">إدخال بيانات الترخيص والسائق والمركبة والمواد المصرّح بها.</span>
          </span>
          <span class="choice-arrow" aria-hidden="true">←</span>
        </a>

        <a class="permit-choice" href="pages/excavation.html">
          <img class="choice-art" src="assets/images/file-text-pineal-700.svg" alt="" aria-hidden="true" />
          <span class="choice-number"></span>
          <span class="choice-content">
            <strong class="choice-title">تصريح حفر</strong>
            <span class="choice-description">متابعة مسار الرخصة الحفرية وفق الخطوات الإدارية المعتمدة.</span>
          </span>
          <span class="choice-arrow" aria-hidden="true">←</span>
        </a>

        <a class="permit-choice" href="pages/pouring.html">
          <img class="choice-art" src="assets/images/package-pineal-700.svg" alt="" aria-hidden="true" />
          <span class="choice-number"></span>
          <span class="choice-content">
            <strong class="choice-title">تصريح صب</strong>
            <span class="choice-description">تسجيل المكان والموقع والعمق للبدء بإجراء التصريح.</span>
          </span>
          <span class="choice-arrow" aria-hidden="true">←</span>
        </a>
      </nav>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
