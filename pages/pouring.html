<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/damascus-eagle.png" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>تصريح صب | مصرّح</title>
  </head>
  <body class="permit-shell">
    <!-- Musarrah reference style: concise three-field form using the supplied wheat and pine design system. -->
    <div class="permit-workspace">
      <header class="permit-topbar">
        <a class="back-link" href="../index.html"><span aria-hidden="true">←</span> أنواع التصاريح</a>
        <div class="compact-brand"><span>مصرّح</span><img src="../assets/images/damascus-eagle.png" alt="شعار محافظة دمشق" /></div>
      </header>
      <main class="permit-page">
        <header class="page-intro">
          <p class="eyebrow">إدارة التصاريح</p>
          <h1>تصريح صب</h1>
          <p>أدخل البيانات الأساسية للتصريح. لا تتضمن هذه المرحلة أي حقول أو إجراءات إضافية.</p>
        </header>
        <form class="form compact-permit-form" data-static-form novalidate>
          <section class="form-card form-card-lg" aria-label="بيانات تصريح الصب">
            <div class="form-grid">
              <div class="field"><label class="field-label" for="concrete-place">المكان</label><input id="concrete-place" name="place" class="field-input" /></div>
              <div class="field"><label class="field-label" for="concrete-location">الموقع</label><input id="concrete-location" name="location" class="field-input" /></div>
              <div class="field field-wide"><label class="field-label" for="concrete-depth">العمق</label><input id="concrete-depth" name="depth" class="field-input" /></div>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-primary btn-lg">حفظ</button></div>
          </section>
        </form>
      </main>
    </div>
    <script src="../js/main.js"></script>
  </body>
</html>
